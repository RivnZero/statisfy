name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Format
        if: runner.os == 'Linux'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build ./...

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Cross-compile release targets
        run: |
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            os="${t%-*}"; arch="${t#*-}"; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "building $t"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "/tmp/statisfy-$t$ext" ./cmd/statisfy || exit 1
          done
          echo "all release targets build"

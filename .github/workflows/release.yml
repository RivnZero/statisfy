name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    name: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Format
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build ./...

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64]
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build (versioned)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA::8} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/statisfy-${{ matrix.target }}${{ matrix.ext }}" ./cmd/statisfy
      - name: Archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "statisfy-${{ matrix.target }}.zip" "statisfy-${{ matrix.target }}.exe"
          else
            tar -czf "statisfy-${{ matrix.target }}.tar.gz" "statisfy-${{ matrix.target }}"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: statisfy-${{ matrix.target }}
          path: dist/*

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Required so the notes-file below exists in the workspace.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt
      # Build a versioned title in front of the static release-notes body so
      # every release (v0.0.1, v0.0.2, ...) gets its own header automatically.
      - name: Prepare release notes
        run: |
          {
            echo "# Statisfy ${GITHUB_REF_NAME}"
            echo
            cat .github/release-notes.md
          } > notes.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # softprops uses `body_path`, not `notes-file` (which it ignores).
          body_path: notes.md
